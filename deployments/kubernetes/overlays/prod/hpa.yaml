apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skill-service-hpa
  namespace: skill-builder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skill-service
  minReplicas: 5
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
