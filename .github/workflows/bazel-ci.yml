name: Bazel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Bazel Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies with uv
        run: uv sync

      - name: Set up Bazelisk / Bazel
        uses: bazelbuild/setup-bazelisk@v4

      - name: Bazel Build
        run: bazel build //...

      - name: Bazel Test
        run: bazel test //...

      - name: Run SDLC Validator
        run: bazel run //:validate
