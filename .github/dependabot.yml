version: 2
updates:
  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain Go modules
  - package-ecosystem: "gofmt"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain Java Maven dependencies
  - package-ecosystem: "maven"
    directory: "/clients/java"
    schedule:
      interval: "weekly"
