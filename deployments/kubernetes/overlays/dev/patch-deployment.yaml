apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-service
  namespace: skill-builder
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: skill-service
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
