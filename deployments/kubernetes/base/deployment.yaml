apiVersion: apps/v1
kind: Deployment
metadata:
  name: castor-registry
  namespace: castor
  labels:
    app.kubernetes.io/name: castor-registry
    app.kubernetes.io/part-of: castor
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: castor-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: castor-registry
        app.kubernetes.io/part-of: castor
    spec:
      serviceAccountName: castor-registry-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: castor-registry
          image: gcr.io/PROJECT_ID/castor-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-rest-mcp
              containerPort: 8000
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: castor-registry-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: castor-registry-db-secret
                  key: database_url
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
