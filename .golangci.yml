run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gosec
    - misspell
    - unconvert
    - revive

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  gosec:
    excludes:
      - G104 # Audit errors not checked
      - G304 # File path provided as taint input (cli tool context)
  misspell:
    locale: US

issues:
  exclude-dirs:
    - bazel-.*
    - .tmp_.*
    - node_modules
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
