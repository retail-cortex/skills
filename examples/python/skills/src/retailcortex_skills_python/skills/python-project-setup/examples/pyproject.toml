[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-python-service"
version = "1.0.0"
description = "Enterprise Python Service powered by uv, FastAPI, and Google ADK"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn>=0.34.0",
    "pydantic>=2.13.3",
    "sqlmodel>=0.0.22",
    "google-adk>=1.16.0",
    "google-genai>=1.0.0",
    "google-cloud-logging>=3.12.0",
    "google-cloud-bigquery>=3.25.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.6",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
