[project]
name = "skills-agent"
version = "1.0.0"
description = "Interactive ADK Programming Agent wrapped in FastAPI for enterprise skills"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn>=0.34.0",
    "pydantic>=2.13.3",
    "google-adk>=1.16.0",
    "google-genai>=1.0.0",
    "tenacity>=9.0.0",
]

[project.scripts]
start-agent = "skills_agent.cli:main"

[tool.uv]
package = false
