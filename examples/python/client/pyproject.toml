[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-client-example"
version = "1.0.0"
description = "Standalone Python Client Example for AI Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "retailcortex-loader>=1.0.0",
]

[tool.uv.sources]
retailcortex-loader = { path = "../../../clients/python", editable = true }
