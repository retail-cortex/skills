site_name: Agent Skill Builder
site_description: Enterprise Project Pattern Registry for AI Agent Skills
site_author: Retail Cortex
site_url: https://retail-cortex.github.io/skills/
repo_url: https://github.com/retail-cortex/skills
repo_name: retail-cortex/skills

plugins:
  - search
  - macros

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - attr_list

nav:
  - Project Overview: index.md
  - Specification: specification.md
  - Architecture: architecture.md
  - Critical Analysis: analysis.md
  - Skills Registry: skills.md
  - CLI Client (skm): cli.md
  - Packages: packages.md
  - Examples: examples.md

