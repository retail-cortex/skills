[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retailcortex-skill-validator"
version = "1.0.0"
description = "Automated 5-point SDLC validator for agentskills.io AI Agent Skills"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = []
authors = [
    { name = "Retail Cortex Engineering" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/retail-cortex/skills"
Repository = "https://github.com/retail-cortex/skills"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
