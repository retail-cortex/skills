[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retailcortex-skills-google-adk-skill-builder"
version = "1.0.0"
description = "Retail Cortex Google Agent Development Kit (ADK) Skill Builder definitions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=1.16.0",
    "retailcortex-skills-loader>=1.0.0",
]
authors = [
    { name = "Retail Cortex Engineering" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/retail-cortex/skills"
Repository = "https://github.com/retail-cortex/skills"

[project.entry-points."retailcortex.skills"]
google_adk_skill_builder = "retailcortex_skills_google_adk_skill_builder"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.*", "**/*", "**/.*"]

[tool.uv]
package = true
