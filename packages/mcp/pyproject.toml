[project]
name = "retailcortex-mcp"
version = "0.1.0"
description = "Enterprise FastMCP server tools for AI Agent Skills"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=0.4.0",
    "sqlmodel>=0.0.22",
    "retailcortex-model",
    "retailcortex-data",
    "retailcortex-services",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
retailcortex-model = { path = "../model" }
retailcortex-data = { path = "../data" }
retailcortex-services = { path = "../services" }

[tool.pytest.ini_options]
pythonpath = ["src", ".", "../../bazel-bin"]
testpaths = ["tests"]
