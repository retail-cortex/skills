[project]
name = "retailcortex-skills"
version = "1.0.0"
description = "Enterprise Project Pattern Registry for AI Agent Skills"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-macros-plugin>=1.3.7",
    "pymdown-extensions>=10.7",
    "retailcortex-loader",
    "retailcortex-skill-validator",
]

[project.scripts]
start-agent = "skills_agent.cli:main"
skills-agent = "skills_agent.cli:main"
docs = "tools.docs.docs:serve"
serve-docs = "tools.docs.docs:serve"
build-docs = "tools.docs.docs:build"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    "tools",
    "packages/loader/src",
    "tests/adk-agent/src",
    "packages/validator/src",
    "packages/skills-python/src",
    "packages/skills-go/src",
    "packages/skills-java/src"
]

[tool.uv]
package = true

[tool.uv.sources]
retailcortex-loader = { path = "packages/loader" }
retailcortex-skill-validator = { path = "packages/validator" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = [
    "packages/loader/src",
    "tests/adk-agent/src",
    "packages/validator/src",
    "packages/skills-python/src",
    "packages/skills-go/src",
    "packages/skills-java/src",
    "examples/example-adk",
    "examples/polyglot-developer",
    "tests/e2e",
    "."
]
testpaths = [
    "packages/loader/tests",
    "tests/adk-agent/tests",
    "packages/validator/tests",
    "examples/polyglot-developer/tests",
    "tests/e2e"
]
