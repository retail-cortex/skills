[project]
name = "retailcortex-skills"
version = "1.0.0"
description = "Enterprise Project Pattern Registry for AI Agent Skills"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-macros-plugin>=1.3.7",
    "pymdown-extensions>=10.7",
]

[project.scripts]
start-agent = "skills_agent.cli:main"
skills-agent = "skills_agent.cli:main"
docs = "skills_loader.docs:serve"
serve-docs = "skills_loader.docs:serve"
build-docs = "skills_loader.docs:build"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    "packages/skills-loader/src",
    "tests/adk-agent/src",
    "packages/validator/src",
    "packages/skills-python/src",
    "packages/skills-go/src",
    "packages/skills-java/src",
    "packages/skills-devops/src",
    "packages/skills-database/src",
    "packages/skills-protobuf/src",
    "packages/skills-google-adk-skill-builder/src",
    "packages/skills-a2a/src",
    "packages/skills-a2ui/src",
    "packages/skills-bazel/src",
    "packages/skills-frontend/src"
]

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = [
    "packages/skills-loader/src",
    "tests/adk-agent/src",
    "packages/validator/src",
    "packages/skills-python/src",
    "packages/skills-go/src",
    "packages/skills-java/src",
    "packages/skills-devops/src",
    "packages/skills-database/src",
    "packages/skills-protobuf/src",
    "packages/skills-google-adk-skill-builder/src",
    "packages/skills-a2a/src",
    "packages/skills-a2ui/src",
    "packages/skills-bazel/src",
    "packages/skills-frontend/src",
    "examples/example-adk",
    "examples/polyglot-developer",
    "tests/e2e",
    "."
]
testpaths = [
    "packages/skills-loader/tests",
    "tests/adk-agent/tests",
    "packages/validator/tests",
    "packages/skills-a2a/tests",
    "packages/skills-a2ui/tests",
    "packages/skills-bazel/tests",
    "examples/polyglot-developer/tests",
    "tests/e2e"
]
