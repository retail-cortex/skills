apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-service
  namespace: skill-builder
  labels:
    app.kubernetes.io/name: skill-service
    app.kubernetes.io/part-of: skill-builder
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: skill-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skill-service
        app.kubernetes.io/part-of: skill-builder
    spec:
      serviceAccountName: skill-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: skill-service
          image: gcr.io/PROJECT_ID/skills-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-rest-mcp
              containerPort: 8000
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: skill-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: skill-service-db-secret
                  key: database_url
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
