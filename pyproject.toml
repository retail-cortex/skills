[project]
name = "retailcortex-skills"
version = "1.0.0"
description = "Enterprise Project Pattern Registry for AI Agent Skills"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "retailcortex-loader",
]

[project.scripts]
start-agent = "skills_agent.cli:main"
skills-agent = "skills_agent.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    "tools",
    "clients/python/src",
    "tests/adk-agent/src",
    "examples/python/skills/src",
    "examples/go/skills/src",
    "examples/java/skills/src"
]

[tool.uv]
package = true

[tool.uv.sources]
retailcortex-loader = { path = "clients/python" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = [
    "clients/python/src",
    "tests/adk-agent/src",
    "examples/python/skills/src",
    "examples/go/skills/src",
    "examples/java/skills/src",
    "tests/e2e",
    "."
]
testpaths = [
    "clients/python/tests",
    "tests/adk-agent/tests",
    "examples/python/polyglot/tests",
    "tests/e2e"
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
