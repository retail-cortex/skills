[project]
name = "retailcortex-data"
version = "0.1.0"
description = "Enterprise datasource connection and repositories for AI Agent Skills"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlmodel>=0.0.22",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.30.0",
    "retailcortex-model",
    "retailcortex-loader",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
retailcortex-model = { path = "../model" }
retailcortex-loader = { path = "../loader" }
