name: Bazel CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/coverage.svg"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-test:
    name: Bazel Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies with uv
        run: uv sync

      - name: Set up Bazelisk / Bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: Bazel Build
        run: bazel build //...

      - name: Bazel Test & Coverage
        run: bazel coverage //... --test_tag_filters=-no-ci,-integration,-manual

      - name: Run SDLC Validator
        run: bazel run //:validate -- version

      - name: Generate Coverage Badge
        uses: GoogleCloudPlatform/lcov-coverage-badge@v2.1.0
        with:
          file: ./bazel-out/_coverage/_coverage_report.dat
          access_token: ${{ secrets.COVERAGE_TOKEN }}
          style: flat