[build-system]
requires = ["setuptools>=61.0", "retailcortex-skills-loader"]
build-backend = "loader.build_meta"

[tool.retailcortex-loader]
dest = ".skills"
dependencies = [
    "github://retail-cortex/skills@main/packages/skills-python"
]

[project]
name = "retailcortex-example-adk"
version = "1.0.0"
description = "Native Google ADK Agent Example loading local and remote GitHub skills"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "retailcortex-skills-loader",
]
authors = [
    { name = "Retail Cortex Engineering" }
]

[project.scripts]
example-adk = "main:run"
example-adk-web = "main:web"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
package = true
