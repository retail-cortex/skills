[project]
name = "retailcortex-services"
version = "0.1.0"
description = "Enterprise service layer for AI Agent Skills"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlmodel>=0.0.22",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "google-genai>=0.1.1",
    "google-auth>=2.36.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-gcp-trace>=1.8.0",
    "grpcio>=1.68.1",
    "retailcortex-model",
    "retailcortex-data",
    "retailcortex-loader",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
retailcortex-model = { path = "../model" }
retailcortex-data = { path = "../data" }
retailcortex-loader = { path = "../loader" }

[tool.pytest.ini_options]
pythonpath = ["src", ".", "../../bazel-bin"]
testpaths = ["tests"]
