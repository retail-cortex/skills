syntax = "proto3";

package retailcortex.castor.v1;

import "retailcortex/castor/v1/skill.proto";

option go_package = "github.com/retail-cortex/castor/proto/retailcortex/castor/v1;castorv1";
option java_package = "com.retailcortex.castor.proto.retailcortex.castor.v1";
option java_multiple_files = true;

// ListSkillsRequest specifies criteria for querying skills.
message ListSkillsRequest {
  string s = 1; // Optional semantic vector search query string
}

// ListSkillsResponse contains a list of matching skill definitions.
message ListSkillsResponse {
  repeated SkillDefinition skills = 1;
}

// GetSkillRequest specifies the skill ID or unique name to retrieve.
message GetSkillRequest {
  string skill_id_or_name = 1;
}

// RegisterSkillRequest contains parameters for creating a new skill.
message RegisterSkillRequest {
  string api_key = 1;
  string name = 2;
  string description = 3;
  string instructions = 4;
  string license = 5;
  string author = 6;
  string version = 7;
  string category = 8;
  repeated string tags = 9;
  repeated string trigger_phrases = 10;
  map<string, string> metadata = 11;
  map<string, string> references = 12;
  map<string, string> examples = 13;
  repeated ScriptDefinition scripts = 14;
  repeated ResourceRequirement resources = 15;
  string source_uri = 16; // Original source URI (e.g. github://google/skills@main/tree/main/skills/cloud/gemini-api)
}


// UpdateSkillRequest contains parameters for modifying an existing skill.
message UpdateSkillRequest {
  string api_key = 1;
  string skill_id = 2;
  string description = 3;
  string instructions = 4;
  string license = 5;
  string category = 6;
  string version = 7;
  map<string, string> metadata = 8;
  map<string, string> references = 9;
  map<string, string> examples = 10;
  repeated ScriptDefinition scripts = 11;
  repeated ResourceRequirement resources = 12;
}

// DeleteSkillRequest specifies the target skill to delete.
message DeleteSkillRequest {
  string api_key = 1;
  string skill_id = 2;
}

// DeleteSkillResponse contains execution status of skill deletion.
message DeleteSkillResponse {
  string status = 1;
  string message = 2;
}

// SkillService provides gRPC and REST methods for skill discovery and lifecycle management.
//
// HTTP Endpoints:
// - GET    /api/v1/skills                    -> ListSkills
// - GET    /api/v1/skills/{skill_id_or_name} -> GetSkill
// - POST   /api/v1/skills                    -> RegisterSkill (Header: X-API-Key)
// - PUT    /api/v1/skills/{skill_id}         -> ReplaceSkill  (Header: X-API-Key)
// - PATCH  /api/v1/skills/{skill_id}         -> UpdateSkill   (Header: X-API-Key)
// - DELETE /api/v1/skills/{skill_id}         -> DeleteSkill   (Header: X-API-Key)
service SkillService {
  // Query matching skill definitions.
  // HTTP: GET /api/v1/skills?s={query}
  rpc ListSkills (ListSkillsRequest) returns (ListSkillsResponse);

  // Retrieve a single skill by ID or unique name.
  // HTTP: GET /api/v1/skills/{skill_id_or_name}
  rpc GetSkill (GetSkillRequest) returns (SkillDefinition);

  // Register a new skill. Requires verified X-API-Key header.
  // HTTP: POST /api/v1/skills
  rpc RegisterSkill (RegisterSkillRequest) returns (SkillDefinition);

  // Update an existing skill definition. Requires verified X-API-Key header.
  // HTTP: PATCH /api/v1/skills/{skill_id}
  rpc UpdateSkill (UpdateSkillRequest) returns (SkillDefinition);

  // Delete a skill by ID. Requires verified X-API-Key header.
  // HTTP: DELETE /api/v1/skills/{skill_id}
  rpc DeleteSkill (DeleteSkillRequest) returns (DeleteSkillResponse);
}
