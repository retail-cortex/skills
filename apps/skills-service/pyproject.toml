[project]
name = "skills-service"
version = "0.1.0"
description = "FastAPI + FastMCP + SQLModel Skills Service with Gemini Embeddings and OpenTelemetry"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "fastmcp>=0.4.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.30.0",
    "google-genai>=0.1.1",
    "google-auth>=2.36.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-gcp-trace>=1.8.0",
    "python-dotenv>=1.0.1",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "retailcortex-loader",
    "retailcortex-model",
    "retailcortex-data",
    "retailcortex-services",
    "retailcortex-mcp",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
retailcortex-loader = { path = "../../packages/loader" }
retailcortex-model = { path = "../../packages/model" }
retailcortex-data = { path = "../../packages/data" }
retailcortex-services = { path = "../../packages/services" }
retailcortex-mcp = { path = "../../packages/mcp" }

[tool.pytest.ini_options]
pythonpath = ["src", ".", "../../bazel-bin"]
testpaths = ["tests"]
