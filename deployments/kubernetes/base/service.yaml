apiVersion: v1
kind: Service
metadata:
  name: skill-service
  namespace: skill-builder
  labels:
    app.kubernetes.io/name: skill-service
    app.kubernetes.io/part-of: skill-builder
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skill-service
  ports:
    - name: http-rest-mcp
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
