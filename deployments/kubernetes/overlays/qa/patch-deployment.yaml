apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-service
  namespace: skill-builder
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: skill-service
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
